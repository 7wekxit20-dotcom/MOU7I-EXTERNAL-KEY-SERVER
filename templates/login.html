<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOU7I EXTERNAL - Admin Login</title>
<style>
*{box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
body{margin:0;background:#0b0b0e;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#15151a;border:1px solid #222;border-radius:18px;padding:28px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:22px} p{margin:0 0 16px;color:#9aa0a6;font-size:13px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2a2a31;background:#0f0f12;color:#fff;outline:none}
button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:12px;background:#6c5cff;color:#fff;font-weight:700;cursor:pointer}
.err{margin-top:12px;background:#2a1214;border:1px solid #5a1f24;color:#ffb4b4;padding:10px;border-radius:10px;font-size:13px}
a{color:#8ea6ff;font-size:12px}
</style></head><body>
<div class="card">
<h1>MOU7I EXTERNAL Key Server</h1><p>Enter admin key to manage licenses</p>
{% if error %}<div class="err">{{error}}</div>{% endif %}
<form method="post">
<input type="password" name="admin_key" placeholder="Admin key (ADMIN_KEY)" required autofocus>
<button type="submit">Enter Dashboard</button>
</form>
<p style="margin-top:14px">Default: <code>CHANGE-ME</code> — set <code>ADMIN_KEY</code> env.</p>
</div></body></html>
